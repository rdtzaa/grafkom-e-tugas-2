<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 2 Grafkom - Scene ITS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="compare-wrapper">
      <section class="panel">
        <h2>Foto Referensi</h2>
        <img src="gambar_referensi.jpeg" alt="Referensi jalan di ITS dengan trotoar dan pembatas kuning-hitam" class="ref-img">
      </section>
      <section class="panel">
        <h2>Simulasi WebGL</h2>
        <canvas id="webgl-canvas" aria-label="Jalan kampus, saluran air, dan perumahan dosen dengan satu gerbang"></canvas>
        <p class="controls-hint">Geser untuk orbit · Scroll / cubit untuk zoom</p>
        <details class="scene-controls">
          <summary>Kontrol scene</summary>
          <div class="control-row">
            <label for="camera-view">Kamera</label>
            <select id="camera-view">
              <option value="overview">Kawasan kampus</option>
              <option value="road">Dari jalan</option>
              <option value="housing">Perumahan dosen</option>
              <option value="entrance">Gerbang dan saluran air</option>
            </select>
            <button id="reset-view" type="button">Reset</button>
          </div>
          <div class="control-row">
            <label for="time-of-day">Waktu: <output id="time-label" for="time-of-day">Siang</output></label>
            <input id="time-of-day" type="range" min="0" max="100" value="15" aria-label="Waktu dari siang ke senja">
            <span>Senja</span>
          </div>
          <div class="control-row options">
            <label><input type="checkbox" id="street-lights" checked> Lampu jalan</label>
            <label><input type="checkbox" id="animate" checked> Animasi</label>
            <button type="button" id="toggle-gates" aria-pressed="false">Buka gerbang utama</button>
          </div>
        </details>
        <p id="scene-status" class="scene-status" role="status">Memuat WebGL…</p>
        <noscript>Aktifkan JavaScript untuk menjalankan simulasi.</noscript>
      </section>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
